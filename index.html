<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dijital Kartvizit</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card-container {
            width: 100%;
            max-width: 400px;
            background: #1e293b;
            border-radius: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
            padding: 32px 24px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .profile-img-container {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 0 auto 20px auto;
        }

        .profile-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #3b82f6;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.4);
        }

        .name {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 6px;
            color: #ffffff;
        }

        .title {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 24px;
            font-weight: 500;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: #334155;
            color: #ffffff;
            padding: 14px 20px;
            border-radius: 14px;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            transition: all 0.2s ease;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .btn i {
            font-size: 18px;
        }

        .btn:hover {
            transform: translateY(-2px);
            background: #475569;
        }

        .btn-primary {
            background: #3b82f6;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        .btn-primary:hover {
            background: #2563eb;
        }

        .btn-whatsapp {
            background: #22c55e;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3);
        }

        .btn-whatsapp:hover {
            background: #16a34a;
        }

        .footer {
            margin-top: 28px;
            font-size: 12px;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="card-container">
        <!-- Profil Fotoğrafı (Kendi resminin linkini buraya koyabilirsin) -->
        <div class="profile-img-container">
            <img src="foto.jpg" alt="Salim DİNÇ" class="profile-img">
        </div>

        <div class="name">Salim DİNÇ</div>
        <div class="title">Ziraat Mühendisi</div>

        <div class="links-container">
            <!-- Rehbere Kaydet Butonu -->
            <a href="contact.vcf" class="btn btn-primary">
                <i class="fa-solid fa-user-plus"></i> Rehbere Kaydet
            </a>

            <!-- Telefonla Arama -->
            <a href="tel:+905453137456" class="btn">
                <i class="fa-solid fa-phone"></i> Hemen Ara
            </a>

            <!-- WhatsApp İletişim -->
            <a href="https://wa.me/905453137456" target="_blank" class="btn btn-whatsapp">
                <i class="fa-brands fa-whatsapp"></i> WhatsApp ile Ulaş
            </a>

            <!-- Instagram / Sosyal Medya -->
            <a href="https://instagram.com/salimmdinc" target="_blank" class="btn">
                <i class="fa-brands fa-instagram"></i> Instagram
            </a>

            <!-- Web Sitesi / Portfolyo -->
            <a href="https://websiteniz.com" target="_blank" class="btn">
                <i class="fa-solid fa-globe"></i> Web Sitem
            </a>
        </div>

        <div class="footer">
            Dijital Kartvizit
        </div>
    </div>

</body>
</html>
